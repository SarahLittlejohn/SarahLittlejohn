name: Qubit snakes and ladders

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qubit-snakes
  cancel-in-progress: false

jobs:
  roll:
    runs-on: ubuntu-latest
    # The script waits up to 40 minutes for the QPU queue, then saves the job to pick up tomorrow.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Roll the quantum dice and move
        env:
          IBM_QUANTUM_TOKEN: ${{ secrets.IBM_QUANTUM_TOKEN }}
          IBM_QUANTUM_INSTANCE: ${{ secrets.IBM_QUANTUM_INSTANCE }}
        run: python qubit_snakes.py

      - name: Commit if changed
        run: |
          git add qubit-snakes.svg data/game.json
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Roll the quantum dice"
          git push
